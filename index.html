<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>ANM HK PPT 智能搜尋</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2/dist/fuse.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: auto; }
        #searchInput { width: 100%; padding: 12px; font-size: 18px; border: 2px solid #007bff; border-radius: 8px; margin-bottom: 20px; }
        .result-item { margin: 10px 0; padding: 15px; border-bottom: 1px solid #eee; }
        .hot { border-left: 5px solid #d35400; background: #fff8f5; }
    </style>
</head>
<body>
    <h2>ANM HK PPT 智能搜尋</h2>
    <input type="text" id="searchInput" placeholder="輸入 ID 或歌詞搜尋...">
    <div id="results">正在載入資料庫...</div>

    <script>
        let fuse;
        Papa.parse("hymns_db.csv", {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                // 自動讀取 CSV 並建立搜尋索引
                fuse = new Fuse(results.data, { 
                    keys: ['ID', 'Text'], 
                    threshold: 0.4,           // 提高容錯率
                    ignoreLocation: true,      // 忽略位置，隨處匹配
                    minMatchCharLength: 1      // 即使只輸入一個字也能搜尋
                });
                document.getElementById('results').innerHTML = '資料庫已就緒。';
            }
        });

        document.getElementById('searchInput').addEventListener('input', (e) => {
            if (!fuse) return;
            const res = fuse.search(e.target.value);
            const container = document.getElementById('results');
            
            if (e.target.value.trim() === "") {
                container.innerHTML = "資料庫已就緒。";
                return;
            }

            container.innerHTML = res.length ? '' : '找不到結果。';
            // 顯示前 50 筆結果
            res.slice(0, 50).forEach(r => {
                const isHot = String(r.item.IsTop1000).includes('1');
                container.innerHTML += `
                    <div class="result-item ${isHot ? 'hot' : ''}">
                        <b>${r.item.ID}</b>: ${r.item.Text}
                    </div>`;
            });
        });
    </script>
</body>
</html>
