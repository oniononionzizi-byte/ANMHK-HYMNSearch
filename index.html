<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>ANM HK PPT 智能搜尋</title>
    
    <!-- 確保這兩個套件先行載入 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2/dist/fuse.min.js"></script>
    
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        #searchInput { width: 100%; max-width: 400px; padding: 12px; font-size: 18px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 5px; }
        .result-item { margin: 10px 0; padding: 10px; border-bottom: 1px solid #eee; }
        .hot { color: #d35400; font-weight: bold; }
    </style>
</head>
<body>
    <h1>ANM HK PPT 智能搜尋</h1>
    <input type="text" id="searchInput" placeholder="搜尋歌名、歌詞或 ID...">
    <div id="results"></div>

    <script>
        const charMap = {
            '祢': '你', '裡': '裏', '唯': '惟',
            '衞': '維', '偉': '維'
        };

        function normalizeText(text) {
            if (!text) return "";
            let str = text.replace(/\s+/g, '');
            for (let key in charMap) {
                str = str.split(key).join(charMap[key]);
            }
            return str;
        }

        let songs = [];
        let fuse;

        // 等待所有資源載入後執行
        window.onload = function() {
            Papa.parse("hymns_db.csv", {
                download: true, header: true, skipEmptyLines: true,
                complete: (results) => {
                    songs = results.data.map(s => ({
                        ...s,
                        normalizedText: normalizeText(s["歌詞文字 (Text)"]),
                        weight: (s["IsTop1000"] == "1") ? 200 : 50
                    }));

                    // 初始化 Fuse，這時候 Fuse 應該已經定義好了
                    if (typeof Fuse !== 'undefined') {
                        fuse = new Fuse(songs, {
                            keys: [
                                { name: "normalizedText", weight: 0.7 },
                                { name: "號碼 (ID)", weight: 0.3 }
                            ],
                            threshold: 0.3,
                            ignoreLocation: true
                        });
                    } else {
                        console.error("Fuse 套件未載入，請檢查網路連接。");
                    }
                }
            });
        };

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const val = normalizeText(e.target.value);
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '';
            
            if (!val || !fuse) return;

            const searchResults = fuse.search(val);
            searchResults.sort((a, b) => b.item.weight - a.item.weight);

            const displayResults = searchResults.slice(0, 20);

            if (displayResults.length === 0) {
                resultsDiv.innerHTML = '<div>找不到結果，請嘗試其他關鍵字。</div>';
            } else {
                displayResults.forEach(res => {
                    const s = res.item;
                    const isHot = s.weight == 200;
                    resultsDiv.innerHTML += `
                        <div class="result-item ${isHot ? 'hot' : ''}">
                            ${isHot ? '🔥 ' : ''} <b>${s["號碼 (ID)"]}</b> ${s["歌詞文字 (Text)"]}
                        </div>`;
                });
            }
        });
    </script>
</body>
</html>
