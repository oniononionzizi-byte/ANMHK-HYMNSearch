<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>ANM HK PPT 智能搜尋</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2/dist/fuse.min.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: auto; }
        #searchInput { width: 100%; padding: 12px; font-size: 18px; border: 2px solid #007bff; border-radius: 8px; }
        .result-item { margin: 10px 0; padding: 15px; border-bottom: 1px solid #eee; }
        .hot { border-left: 5px solid #d35400; background: #fff8f5; }
    </style>
</head>
<body>
    <h2>ANM HK PPT 智能搜尋</h2>
    <input type="text" id="searchInput" placeholder="輸入 ID 或歌詞搜尋...">
    <div id="results">搜尋引擎就緒...</div>

    <script>
        let fuse;
        Papa.parse("hymns_db.csv", {
            download: true,
            header: true,
            skipEmptyLines: true,
            complete: function(results) {
                // 自動轉譯標題：直接使用 CSV 中的欄位名稱（即使標題有括號）
                const keys = Object.keys(results.data[0]);
                const data = results.data.map(row => ({
                    id: row[keys[0]], 
                    text: row[keys[1]], 
                    isTop: row[keys[2]]
                }));
                fuse = new Fuse(data, { keys: ['id', 'text'], threshold: 0.3 });
                document.getElementById('results').innerHTML = '資料庫已載入。';
            }
        });

        document.getElementById('searchInput').addEventListener('input', (e) => {
            if (!fuse) return;
            const res = fuse.search(e.target.value);
            document.getElementById('results').innerHTML = res.length ? '' : '找不到結果';
            res.slice(0, 15).forEach(r => {
                const isHot = String(r.item.isTop).includes('1');
                document.getElementById('results').innerHTML += `
                    <div class="result-item ${isHot ? 'hot' : ''}">
                        <b>${r.item.id}</b>: ${r.item.text}
                    </div>`;
            });
        });
    </script>
</body>
</html>
